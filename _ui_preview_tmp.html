<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#2b2b2b;font-family:Roboto,'Segoe UI',system-ui,sans-serif;
     display:flex;gap:20px;padding:20px;align-items:flex-start}
.cap{color:#fff;font-size:12px;padding:6px 0}
.dev{background:#F8FFF9;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;width:360px}
.banner{padding-top:4px;height:70px;display:flex;align-items:center;justify-content:center;position:relative}
.banner img{height:70px;max-width:100%;object-fit:contain}
.cart{position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:22px;background:#fff;
      display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hdr{display:flex;align-items:center;padding:8px 16px 4px}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 16px;border-radius:12px;
      border:1.5px solid #2D6A4F;color:#1B4332;font-weight:700;font-size:16px;box-sizing:border-box;white-space:nowrap}
.sel{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px 16px 0;font-size:13px}
.sel .lab{color:#6B7280}.sel .val{font-weight:800;color:#1B4332}.sel .sep{color:#ccc;margin:0 2px}
.divider{height:1px;background:#E5E7EB;margin-top:8px}
.headWrap{display:flex;justify-content:center;margin:16px 0 8px}
.pill{background:#ffbd4a;padding:6px 32px;border-radius:12px;border:1px solid #000;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pillText{font-size:18px;font-weight:800;color:#fff;letter-spacing:.5px;
  text-shadow:-1px -1px 0 #3D6F73,1px -1px 0 #3D6F73,-1px 1px 0 #3D6F73,1px 1px 0 #3D6F73}
.search{margin:0 16px 12px;height:48px;border-radius:12px;border:1px solid #E5E7EB;background:#fff;
        display:flex;align-items:center;padding:0 16px;color:#6B7280;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 10px}
.card{aspect-ratio:1;background:#3d6f73;border-radius:12px;display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:13px}
</style></head><body><div><div class="cap">AFTER: divider under header, gap under heading</div>
